<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bindhu & Varun ❤️ 27 Days of Love</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #1a0b0b 0%, #2d1414 100%);
      font-family: 'Georgia', serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .heart-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .floating-heart {
      position: absolute;
      font-size: 1.5rem;
      color: rgba(255, 50, 50, 0.15);
      animation: floatHeart 8s ease-in-out infinite;
    }

    @keyframes floatHeart {
      0% {
        transform: translateY(100vh) scale(0.5);
        opacity: 0;
      }
      10% { opacity: 0.8; }
      90% { opacity: 0.8; }
      100% {
        transform: translateY(-10vh) scale(1.2);
        opacity: 0;
      }
    }

    .container {
      max-width: 900px;
      width: 100%;
      background: rgba(255, 245, 240, 0.95);
      border-radius: 2rem;
      padding: 2rem;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
      border: 2px solid #ffb3b3;
      position: relative;
      z-index: 1;
    }

    .header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .header h1 {
      font-size: 2.2rem;
      color: #a12222;
      margin-bottom: 0.5rem;
    }

    .header p {
      color: #5a2d2d;
      margin: 0.3rem 0;
    }

    .special-memory {
      background: linear-gradient(135deg, #fff0ec, #ffd9d9);
      border-radius: 1.5rem;
      padding: 0.6rem 1.2rem;
      display: inline-block;
      margin-top: 0.5rem;
      border: 2px solid #a12222;
      color: #641e1e;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .progress-bar {
      display: flex;
      gap: 0.3rem;
      justify-content: center;
      flex-wrap: wrap;
      margin: 1rem 0 1.5rem;
    }

    .dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #ecc0c0;
      border: 2px solid #dba8a8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: #5a2d2d;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .dot.active {
      background: #a12222;
      color: white;
      border-color: #a12222;
      transform: scale(1.2);
    }

    .dot.completed {
      background: #2d7a4a;
      border-color: #2d7a4a;
      color: white;
    }

    .page-content {
      background: #fffcf9;
      border-radius: 1.5rem;
      padding: 2rem;
      border: 2px solid #ffd9d9;
      min-height: 300px;
      text-align: center;
    }

    .page-content h2 {
      color: #641e1e;
      margin-bottom: 1.5rem;
      font-size: 1.5rem;
    }

    .message-box {
      font-size: 1.2rem;
      color: #2d1414;
      line-height: 1.8;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin: 1rem 0;
    }

    button {
      background: #f5e3e3;
      border: 2px solid #dba8a8;
      padding: 0.7rem 1.5rem;
      border-radius: 50px;
      cursor: pointer;
      font-size: 1rem;
      color: #2d1414;
      transition: 0.2s;
      font-family: inherit;
    }

    button:hover:not(:disabled) {
      background: #dba8a8;
      color: white;
      transform: scale(1.02);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button.correct {
      background: #2d7a4a;
      color: white;
      border-color: #2d7a4a;
    }

    button.wrong {
      background: #a12222;
      color: white;
      border-color: #a12222;
    }

    .feedback {
      margin: 1rem 0;
      font-weight: bold;
      min-height: 1.5rem;
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.5rem;
      gap: 1rem;
    }

    .nav button {
      background: #a12222;
      color: white;
      border: none;
      padding: 0.6rem 1.5rem;
    }

    .nav button:hover:not(:disabled) {
      background: #c03939;
    }

    .nav button:disabled {
      opacity: 0.3;
    }

    .page-num {
      color: #5a2d2d;
    }

    .footer {
      text-align: center;
      color: #4f2b2b;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid #ecc0c0;
      font-size: 0.85rem;
    }

    @media (max-width: 600px) {
      .header h1 { font-size: 1.5rem; }
      .page-content { padding: 1.2rem; }
      .special-memory { font-size: 0.8rem; }
    }
  </style>
</head>
<body>

<div class="heart-bg" id="heartBg"></div>

<div class="container">
  <div class="header">
    <h1>❤️ Bindhu & Varun ❤️</h1>
    <p><strong>Bindhu (19)</strong> ❤️ <strong>Varun (23)</strong></p>
    <p>27 Days of Our Love Story</p>
    <div class="special-memory">
      🚂 Kachiguda Railway Station · Platform No. 2 🚂
    </div>
  </div>

  <div class="progress-bar" id="progressBar"></div>

  <div class="page-content" id="pageContent"></div>

  <div class="nav">
    <button id="prevBtn" onclick="prev()" disabled>← Previous</button>
    <span class="page-num" id="pageNum">Page 1 / 27</span>
    <button id="nextBtn" onclick="next()">Next →</button>
  </div>

  <div class="footer">
    Made with all my love for you, Varun ❤️ ~ Bindhu
  </div>
</div>

<script>
  // Create floating hearts
  function createHearts() {
    const bg = document.getElementById('heartBg');
    const hearts = ['❤️', '💕', '💗', '💖'];
    for (let i = 0; i < 20; i++) {
      const heart = document.createElement('div');
      heart.className = 'floating-heart';
      heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
      heart.style.left = Math.random() * 100 + '%';
      heart.style.top = Math.random() * 100 + '%';
      heart.style.fontSize = (1 + Math.random() * 2) + 'rem';
      heart.style.animationDelay = Math.random() * 6 + 's';
      bg.appendChild(heart);
    }
  }
  createHearts();

  // Pages data
  const pages = [
    { type: 'message', title: '💌 Welcome, My Love', content: 'Welcome to our love story, Varun! Click through 27 pages filled with memories, games, and my love for you. 💕' },
    { type: 'qa', title: '❓ Love Quiz', q: 'Where did we meet?', opts: ['Secunderabad', 'Kachiguda', 'Hyderabad', 'Nampally'], ans: 1 },
    { type: 'message', title: '💖 A Thought', content: 'You make my heart skip a beat every single day. Thank you for being my everything. ❤️' },
    { type: 'qa', title: '❓ Our Platform', q: 'Which platform?', opts: ['Platform 1', 'Platform 2', 'Platform 3', 'Platform 4'], ans: 1 },
    { type: 'message', title: '✨ Memory', content: 'That train ride changed my entire life. You changed my entire life. I love you so much! 🚂' },
    { type: 'game', title: '🎮 Guess the Word', word: 'LOVE', hint: 'What I feel for you' },
    { type: 'message', title: '💑 Together', content: 'Every moment with you is magical. Even the quiet ones. Especially the quiet ones. 💕' },
    { type: 'qa', title: '❓ Our Song', q: 'Favorite song?', opts: ['Perfect', 'Thinking Out Loud', 'All of Me', 'Our Song'], ans: 0 },
    { type: 'message', title: '🌹 Your Smile', content: 'Your smile is my favorite thing in the world. It lights up my darkest days. ❤️' },
    { type: 'game', title: '🎮 Word Scramble', word: 'HEART', hint: 'It beats for you' },
    { type: 'message', title: '🌙 Nights with You', content: 'I could spend forever just talking to you under the stars. You\'re my dream come true. 💫' },
    { type: 'qa', title: '❓ Best Gift', q: 'What\'s the best gift I gave you?', opts: ['Watch', 'Letter', 'Time', 'My Love'], ans: 3 },
    { type: 'message', title: '💝 Gratitude', content: 'Thank you for loving me the way you do. Thank you for being patient, kind, and so incredibly special. 💖' },
    { type: 'game', title: '🎮 Word Game', word: 'FOREVER', hint: 'How long I\'ll love you' },
    { type: 'message', title: '🎯 My Promise', content: 'I promise to love you, support you, and stand by you forever. You\'re my forever person. 💕' },
    { type: 'qa', title: '❓ Future', q: 'Where do you see us?', opts: ['Together', 'Always', 'Forever', 'All of Above'], ans: 3 },
    { type: 'message', title: '🌟 Destiny', content: 'That train brought us together. Destiny knew what it was doing. Thank you, fate. 🚂❤️' },
    { type: 'game', title: '🎮 Scramble', word: 'SOULMATE', hint: 'What you are to me' },
    { type: 'message', title: '💫 Dreams', content: 'You\'re not just my boyfriend, you\'re my best friend, my dream, my everything. 💕' },
    { type: 'qa', title: '❓ Love Language', q: 'How do I love you best?', opts: ['Words', 'Time', 'Touch', 'All Ways'], ans: 3 },
    { type: 'message', title: '🎊 Celebration', content: 'Every day with you is a celebration of love. Thank you for making my life so beautiful. ❤️' },
    { type: 'message', title: '🌸 Always', content: 'Through every season, every storm, every joy - I choose you. Always and forever. 💕' },
    { type: 'message', title: '📍 Kachiguda', content: 'Platform No. 2 will always be our special place. Where two souls became one. 🚂💕' },
    { type: 'message', title: '🎁 27 Days', content: 'These 27 days with you have been the happiest of my life. I can\'t wait for 27 more years! 💖' },
    { type: 'message', title: '💌 Almost There', content: 'One more page, my love. Are you ready for my final message to you? 💕' },
    { type: 'message', title: '💐 Special', content: 'You\'re my past, my present, my future. You\'re my home, my peace, my everything. Forever yours, Bindhu ❤️' },
  ];

  let currentPage = 0;

  function renderProgress() {
    const bar = document.getElementById('progressBar');
    bar.innerHTML = '';
    for (let i = 0; i < 27; i++) {
      const dot = document.createElement('div');
      dot.className = 'dot';
      dot.textContent = i + 1;
      if (i === currentPage) dot.classList.add('active');
      if (i < currentPage) dot.classList.add('completed');
      dot.onclick = () => { currentPage = i; render(); };
      bar.appendChild(dot);
    }
  }

  function render() {
    const page = pages[currentPage];
    const content = document.getElementById('pageContent');
    
    let html = `<h2>${page.title}</h2>`;
    
    if (page.type === 'message') {
      html += `<div class="message-box">${page.content}</div>`;
    } else if (page.type === 'qa') {
      html += `<p style="font-size: 1.1rem; margin: 1rem 0;">${page.q}</p>
               <div class="options" id="options">
                 ${page.opts.map((opt, i) => `
                   <button onclick="checkAnswer(${i}, ${page.ans})">${opt}</button>
                 `).join('')}
               </div>
               <div class="feedback" id="feedback"></div>`;
    } else if (page.type === 'game') {
      const scrambled = page.word.split('').sort(() => Math.random() - 0.5).join('');
      html += `<p style="color: #7a4a4a; font-size: 0.9rem; margin: 0.5rem 0;">${page.hint}</p>
               <p style="font-size: 2.5rem; letter-spacing: 8px; margin: 1rem 0; color: #a12222;">${scrambled}</p>
               <input type="text" id="gameInput" placeholder="Type answer..." style="padding: 0.6rem; border: 2px solid #dba8a8; border-radius: 50px; font-size: 1rem; width: 70%; max-width: 300px;">
               <br><button onclick="checkGame('${page.word}')">Check Answer</button>
               <div class="feedback" id="gameFeedback"></div>`;
    }
    
    content.innerHTML = html;
    document.getElementById('pageNum').textContent = `Page ${currentPage + 1} / 27`;
    document.getElementById('prevBtn').disabled = currentPage === 0;
    document.getElementById('nextBtn').disabled = currentPage === 26;
    renderProgress();
  }

  function next() {
    if (currentPage < 26) { currentPage++; render(); }
  }

  function prev() {
    if (currentPage > 0) { currentPage--; render(); }
  }

  function checkAnswer(selected, correct) {
    const btns = document.querySelectorAll('.options button');
    btns.forEach((b, i) => {
      b.disabled = true;
      if (i === correct) b.classList.add('correct');
      if (i === selected && i !== correct) b.classList.add('wrong');
    });
    document.getElementById('feedback').textContent = selected === correct ? '✓ Correct! 💕' : '✗ Oops! Try again!';
    document.getElementById('feedback').style.color = selected === correct ? '#2d7a4a' : '#a12222';
  }

  function checkGame(word) {
    const input = document.getElementById('gameInput').value.toUpperCase();
    const fb = document.getElementById('gameFeedback');
    if (input === word) {
      fb.textContent = '✓ Correct! Well done! 💕';
      fb.style.color = '#2d7a4a';
      document.getElementById('gameInput').disabled = true;
      document.querySelector('button[onclick*="checkGame"]').disabled = true;
    } else {
      fb.textContent = '✗ Not right. Try again!';
      fb.style.color = '#a12222';
    }
  }

  render();
</script>

</body>
</html>
